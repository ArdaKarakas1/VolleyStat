name: Android build
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-build.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Also verifies the committed gradle-wrapper.jar against official checksums.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core rules + app copy)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Debug APK and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volleystat-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            android/**/build/reports/tests/
          if-no-files-found: warn
