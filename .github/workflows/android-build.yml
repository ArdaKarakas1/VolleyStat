name: Android build
on:
  push:
    branches: [main]
    paths: ["android/**", "backend/**", "tools/require_tests_ran.py", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["android/**", "backend/**", "tools/require_tests_ran.py", ".github/workflows/android-build.yml"]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Unit tests, screenshots, APK, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Also verifies the committed gradle-wrapper.jar against official checksums.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and rendered screenshots
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest -Proborazzi.test.record=true
      - name: Debug APK and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volleystat-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            android/**/build/reports/tests/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

  e2e:
    name: App against the real backend (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (the backend probes every upload with ffprobe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements.txt
      - name: Synthetic test clip (a test pattern, no real footage)
        run: >
          ffmpeg -v error -f lavfi -i testsrc2=size=1280x720:rate=30 -t 100
          -c:v libx264 -preset veryfast -b:v 700k -pix_fmt yuv420p -movflags +faststart
          "$RUNNER_TEMP/clip.mp4"
      - name: Start the backend with the demo analyzer
        working-directory: backend
        run: |
          VOLLEYSTAT_STORAGE="$RUNNER_TEMP/storage" nohup python -m app --port 8000 --analyzer demo > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8000/v1/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/v1/health
      - name: End-to-end tests
        working-directory: android
        env:
          VOLLEYSTAT_E2E_URL: http://127.0.0.1:8000/v1
          VOLLEYSTAT_E2E_VIDEO: ${{ runner.temp }}/clip.mp4
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*E2eTest*'
      - name: The end-to-end tests must have run, not skipped
        run: python tools/require_tests_ran.py android/app/build/test-results/testDebugUnitTest 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            android/app/build/reports/tests/
            ${{ runner.temp }}/backend.log
          if-no-files-found: warn

  device:
    name: Camera, playback and the journey on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (the backend probes every upload with ffprobe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements.txt
      - name: Start the backend with the demo analyzer
        working-directory: backend
        run: |
          VOLLEYSTAT_STORAGE="$RUNNER_TEMP/storage" nohup python -m app --port 8000 --analyzer demo > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8000/v1/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/v1/health
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator reaches the runner's loopback, where the backend listens, as 10.0.2.2.
      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: The device tests must have run, not skipped
        run: python tools/require_tests_ran.py android/app/build/outputs/androidTest-results 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/backend.log
          if-no-files-found: warn
