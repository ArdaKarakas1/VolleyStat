plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}

android {
    namespace 'com.volleyvolleystat.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.volleyvolleystat.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
