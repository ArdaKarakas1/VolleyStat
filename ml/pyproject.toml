[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volleystat_ml"
dynamic = ["version"]
description = "VolleyStat analysis baseline and measurement tools (rally segmentation, boundary metrics, label and split checks)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["volleystat_ml", "volleystat_ml.schemas"]

# The schema and the CSV templates stay in ml/schemas so they can be compared with the
# handover package file by file, and ship inside the wheel as volleystat_ml.schemas.
[tool.setuptools.package-dir]
"volleystat_ml" = "volleystat_ml"
"volleystat_ml.schemas" = "schemas"

[tool.setuptools.package-data]
"volleystat_ml.schemas" = ["*.json", "*.csv"]

[tool.setuptools.dynamic]
version = { attr = "volleystat_ml.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
